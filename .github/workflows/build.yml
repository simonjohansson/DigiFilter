name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: jdx/mise-action@v5
        with:
          bootstrap: true
          # Build and host tests do not need the simulator environment.
          bootstrap_skip: task
      - name: Download stock OS 1.54
        run: curl --fail --location --retry 3 --output Digitakt_OS1.54_dist.zip https://www.elektron.se/wp-content/uploads/2026/10/Digitakt_OS1.54_dist.zip
      - name: Verify and extract stock OS
        shell: mise exec -- python {0}
        run: |
          import hashlib
          from pathlib import Path
          import zipfile

          with zipfile.ZipFile("Digitakt_OS1.54_dist.zip") as archive:
              stock = archive.read("Digitakt_OS1.54.syx")
          expected = "f78ba80fa7b1da5fb0e1ff61ad61e9e71aafe79f4364fc49679f3651353e3cf6"
          if hashlib.sha256(stock).hexdigest() != expected:
              raise ValueError("Unexpected stock OS 1.54 checksum")
          Path("firmware").mkdir(exist_ok=True)
          Path("firmware/Digitakt_OS1.54.syx").write_bytes(stock)
      - name: Build, lint and check composition
        run: mise run check
      - name: Test
        run: mise run test
